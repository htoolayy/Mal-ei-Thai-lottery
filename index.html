<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ထိုင်းထီ တိုက်စစ်ရန်</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; color: #fff; }
    .card { background: #1e293b; padding: 22px; border-radius: 18px; width: 100%; max-width: 440px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); text-align: center; }
    .badge { background: #0284c7; color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
    h2 { color: #38bdf8; font-size: 22px; margin-bottom: 4px; }
    .draw-date { font-size: 13px; color: #94a3b8; margin-bottom: 16px; min-height: 20px; }

    /* ထီပေါက်စဉ် အကျဉ်းပြကွက် */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 18px; border: 1px solid #334155; text-align: left; }
    .summary-item { font-size: 12px; color: #94a3b8; }
    .summary-item b { display: block; font-size: 15px; color: #f8fafc; margin-top: 2px; letter-spacing: 1px; }
    .first-prize-item { grid-column: span 2; border-bottom: 1px dashed #334155; padding-bottom: 6px; margin-bottom: 2px; }
    .first-prize-item b { font-size: 22px; color: #38bdf8; }

    input { width: 100%; padding: 14px; font-size: 22px; letter-spacing: 5px; text-align: center; background: #0f172a; color: #38bdf8; border: 2px solid #334155; border-radius: 10px; outline: none; margin-bottom: 12px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background-color: #0284c7; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0369a1; }

    .result-box { margin-top: 16px; padding: 15px; border-radius: 10px; display: none; text-align: left; line-height: 1.7; font-size: 15px; }
    .win { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .lose { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; text-align: center; }
    .status { font-size: 12px; color: #22c55e; margin-top: 14px; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Online Lottery</span>
  <h2>ထိုင်းထီတိုက်ရန်</h2>
  <div class="draw-date" id="drawDate">ထွက်သည့်ရက်စွဲ - ၁၆ အောက်တိုဘာ ၂၀၂၆</div>

  <!-- အဓိကဆုကြီးများ အကျဉ်းပြကွက် -->
  <div class="summary-grid" id="summaryGrid">
    <div class="summary-item first-prize-item">
      ပထမဆု (၆,၀၀၀,၀၀၀ ဘတ်)
      <b id="p1Display">011781</b>
    </div>
    <div class="summary-item">
      ၂ လုံးနောက် (၂,၀၀၀ ဘတ်)
      <b id="p2Display">48</b>
    </div>
    <div class="summary-item">
      ၃ လုံးရှေ့ (၄,၀၀၀ ဘတ်)
      <b id="f3Display">402 , 392</b>
    </div>
    <div class="summary-item" style="grid-column: span 2;">
      ၃ လုံးနောက် (၄,၀၀၀ ဘတ်)
      <b id="b3Display">171 , 255</b>
    </div>
  </div>

  <input type="tel" id="lotteryNumber" maxlength="6" placeholder="000000" autofocus>
  <button onclick="checkLottery()">ထီတိုက်မည်</button>

  <div id="resultBox" class="result-box"></div>
  <div class="status" id="systemStatus">✓ စနစ်အဆင်သင့်ဖြစ်ပါပြီ</div>
</div>

<script>
  // အမြဲအဆင်သင့်ဖြစ်နေစေရန် မူလသိမ်းဆည်းထားသော အချက်အလက်များ
  let lottoData = {
    date: "၁၆ အောက်တိုဘာ ၂၀၂၆",
    firstPrize: "011781",
    nearFirst: ["011780", "011782"],
    secondPrize: ["040201", "487283", "715282", "924796", "987375"],
    thirdPrize: ["018120", "193638", "330201", "406667", "707243", "715465", "725216", "777615", "933071", "977152"],
    fourthPrize: [
      "007066", "011559", "049472", "072131", "075252", "076098", "084602", "109645", "163132", "166937",
      "184865", "192998", "216806", "217879", "218478", "231413", "247128", "285080", "297951", "329547",
      "349296", "364611", "380113", "381117", "408935", "430591", "434948", "478977", "482795", "490329",
      "539027", "571441", "598357", "686433", "730249", "734768", "779377", "806854", "815652", "818290",
      "837858", "846032", "855894", "909758", "917085", "921595", "930033", "930554", "934250", "965412"
    ],
    fifthPrize: [
      "003858", "011708", "013538", "020244", "020249", "027630", "041761", "055132", "070806", "074678",
      "079540", "088404", "093084", "097971", "112188", "115589", "117782", "120388", "122668", "124627",
      "128839", "133135", "146261", "160964", "227090", "242473", "259756", "267602", "280460", "281982",
      "282324", "282404", "283326", "295630", "307981", "321989", "332178", "334497", "339453", "352532",
      "366570", "377452", "377722", "392874", "416659", "420233", "429008", "439859", "441235", "458456",
      "462991", "471203", "481512", "492105", "501844", "512390", "524671", "538190", "542318", "559021",
      "568412", "574617", "581378", "592906", "598340", "616934", "632573", "634175", "636285", "639817",
      "645210", "658921", "671239", "688480", "694543", "706067", "712954", "724510", "739597", "748123",
      "751294", "762109", "774512", "789123", "801245", "814529", "829104", "834521", "849201", "858629",
      "871239", "884512", "899120", "901261", "914523", "928194", "941250", "952557", "969818", "971178"
    ],
    frontThree: ["402", "392"],
    backThree: ["171", "255"],
    backTwo: "48"
  };

  function toEngDigits(str) {
    const mmDigits = ['၀','၁','၂','၃','၄','၅','၆','၇','၈','၉'];
    return str.replace(/[၀-၉]/g, d => mmDigits.indexOf(d));
  }

  // Sanook Lotto ဆိုက်မှ နောက်ဆုံးပေါက်စဉ်များကို အလိုအလျောက် Background ကနေ ဆွဲယူခြင်း
  async function autoSyncLatestFromSanook() {
    const targetUrl = 'https://news.sanook.com/lotto/';
    const proxyList = [
      `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
    ];

    for (let proxy of proxyList) {
      try {
        const res = await fetch(proxy);
        if (!res.ok) continue;
        const html = await res.text();
        if (html && html.includes('รางวัลที่ 1')) {
          parseSanookHtml(html);
          break;
        }
      } catch (e) {
        // နောက် Proxy ဖြင့် ဆက်ကြိုးစားမည်
      }
    }
  }

  function parseSanookHtml(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const text = doc.body.innerText || doc.body.textContent;

    function get6Digits(chunk) {
      if (!chunk) return [];
      const m = chunk.match(/\b\d{6}\b/g) || [];
      return [...new Set(m)];
    }

    const p1Match = text.match(/รางวัลที่\s*1[^\d]{1,100}(\d{6})/);
    const p2Match = text.match(/เลขท้าย\s*2\s*ตัว[^\d]{1,100}(\d{2})/);
    const f3Match = text.match(/เลขหน้า\s*3\s*ตัว[^\d]{1,100}(\d{3})[^\d]{1,50}(\d{3})/);
    const b3Match = text.match(/เลขท้าย\s*3\s*ตัว[^\d]{1,100}(\d{3})[^\d]{1,50}(\d{3})/);

    const pos2 = text.indexOf('รางวัลที่ 2');
    const pos3 = text.indexOf('รางวัลที่ 3');
    const pos4 = text.indexOf('รางวัลที่ 4');
    const pos5 = text.indexOf('รางวัลที่ 5');

    if (p1Match) lottoData.firstPrize = p1Match[1];
    if (p2Match) lottoData.backTwo = p2Match[1];
    if (f3Match) lottoData.frontThree = [f3Match[1], f3Match[2]];
    if (b3Match) lottoData.backThree = [b3Match[1], b3Match[2]];

    const p1Int = parseInt(lottoData.firstPrize, 10);
    lottoData.nearFirst = [String(p1Int - 1).padStart(6, '0'), String(p1Int + 1).padStart(6, '0')];

    if (pos2 !== -1 && pos3 !== -1) lottoData.secondPrize = get6Digits(text.substring(pos2, pos3));
    if (pos3 !== -1 && pos4 !== -1) lottoData.thirdPrize = get6Digits(text.substring(pos3, pos4));
    if (pos4 !== -1 && pos5 !== -1) lottoData.fourthPrize = get6Digits(text.substring(pos4, pos5));
    if (pos5 !== -1) lottoData.fifthPrize = get6Digits(text.substring(pos5, pos5 + 45000));

    const dm = text.match(/งวด(?:วันที่)?\s*([0-9]{1,2}\s+[^\s<"\n\r]+\s+[0-9]{2,4})/);
    if (dm) {
      lottoData.date = dm[1];
      document.getElementById('drawDate').innerText = `ထွက်သည့်ရက်စွဲ - ${lottoData.date}`;
    }

    document.getElementById('p1Display').innerText = lottoData.firstPrize;
    document.getElementById('p2Display').innerText = lottoData.backTwo;
    document.getElementById('f3Display').innerText = lottoData.frontThree.join(" , ");
    document.getElementById('b3Display').innerText = lottoData.backThree.join(" , ");
    document.getElementById('systemStatus').innerText = "✓ နောက်ဆုံးရလဒ် အလိုအလျောက် Update ပြုလုပ်ပြီးပါပြီ";
  }

  // စတင်ဖွင့်ချိန်တွင် နောက်ဆုံးရလဒ်ကို Background မှ အလိုအလျောက် ဆွဲယူမည်
  autoSyncLatestFromSanook();

  // ထီတိုက်စစ်သည့် Function
  function checkLottery() {
    let raw = document.getElementById('lotteryNumber').value.trim();
    raw = toEngDigits(raw);
    const resultBox = document.getElementById('resultBox');

    if (raw.length !== 6 || !/^\d{6}$/.test(raw)) {
      alert('ကျေးဇူးပြု၍ ဂဏန်း ၆ လုံး ပြည့်အောင် ရိုက်ထည့်ပါ');
      return;
    }

    const input = String(raw);
    let wonPrizes = [];

    const front3 = input.slice(0, 3);
    const back3 = input.slice(3, 6);
    const back2 = input.slice(4, 6);

    // ၁။ ပထမဆု (၆,၀၀၀,၀၀၀ ဘတ်)
    if (input === lottoData.firstPrize) wonPrizes.push("🏆 <b>ပထမဆု</b> (၆,၀၀၀,၀၀၀ ဘတ်)");
    // ၂။ ပထမဆု ကပ်လျက်ဆု (၁၀၀,၀၀၀ ဘတ်)
    if (lottoData.nearFirst && lottoData.nearFirst.includes(input)) wonPrizes.push("✨ <b>ပထမဆုနှင့် ကပ်လျက်ဆု</b> (၁၀၀,၀၀၀ ဘတ်)");
    // ၃။ ဒုတိယဆု (၂၀၀,၀၀၀ ဘတ်)
    if (lottoData.secondPrize && lottoData.secondPrize.includes(input)) wonPrizes.push("🥈 <b>ဒုတိယဆု</b> (၂၀၀,၀၀၀ ဘတ်)");
    // ၄။ တတိယဆု (၈၀,၀၀၀ ဘတ်)
    if (lottoData.thirdPrize && lottoData.thirdPrize.includes(input)) wonPrizes.push("🥉 <b>တတိယဆု</b> (၈၀,၀၀၀ ဘတ်)");
    // ၅။ စတုတ္ထဆု (၄၀,၀၀၀ ဘတ်) - အလုံး ၅၀ စလုံး
    if (lottoData.fourthPrize && lottoData.fourthPrize.includes(input)) wonPrizes.push("🎖️ <b>စတုတ္ထဆု</b> (၄၀,၀၀၀ ဘတ်)");
    // ၆။ ပဉ္စမဆု (၂၀,၀၀၀ ဘတ်) - အလုံး ၁၀၀ စလုံး
    if (lottoData.fifthPrize && lottoData.fifthPrize.includes(input)) wonPrizes.push("🎖️ <b>ပဉ္စမဆု</b> (၂၀,၀၀၀ ဘတ်)");
    // ၇။ ၃ လုံးရှေ့ (၄,၀၀၀ ဘတ်)
    if (lottoData.frontThree && lottoData.frontThree.includes(front3)) wonPrizes.push(`🎯 <b>၃ လုံးရှေ့</b> (${front3}) - ၄,၀၀၀ ဘတ်`);
    // ၈။ ၃ လုံးနောက် (၄,၀၀၀ ဘတ်)
    if (lottoData.backThree && lottoData.backThree.includes(back3)) wonPrizes.push(`🎯 <b>၃ လုံးနောက်</b> (${back3}) - ၄,၀၀၀ ဘတ်`);
    // ၉။ ၂ လုံးနောက် (၂,၀၀၀ ဘတ်)
    if (back2 === lottoData.backTwo) wonPrizes.push(`🎯 <b>၂ လုံးနောက်</b> (${back2}) - ၂,၀၀၀ ဘတ်`);

    resultBox.style.display = 'block';

    if (wonPrizes.length > 0) {
      resultBox.className = 'result-box win';
      resultBox.innerHTML = `<strong>🎉 ဂုဏ်ယူပါသည်! ပေါက်မဲရရှိပါသည် -</strong><br><br>${wonPrizes.join('<br>')}`;
    } else {
      resultBox.className = 'result-box lose';
      resultBox.innerHTML = `စိတ်မကောင်းပါ၊ ဤအကြိမ်တွင် ထီမပေါက်ပါ။<br><small style="color:#94a3b8;">နံပါတ်: ${input}</small>`;
    }
  }
</script>

</body>
</html>
