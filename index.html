<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>မယ်အိ ထိုင်းထီ တိုက်စစ်ရန်</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; color: #fff; }
    .card { background: #1e293b; padding: 22px; border-radius: 18px; width: 100%; max-width: 440px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); text-align: center; }
    .badge { background: #0284c7; color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
    h2 { color: #38bdf8; font-size: 22px; margin-bottom: 4px; }
    .draw-date { font-size: 13px; color: #94a3b8; margin-bottom: 16px; min-height: 20px; }

    /* ထီပေါက်စဉ် အကျဉ်းပြကွက် */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 18px; border: 1px solid #334155; text-align: left; }
    .summary-item { font-size: 12px; color: #94a3b8; }
    .summary-item b { display: block; font-size: 15px; color: #f8fafc; margin-top: 2px; letter-spacing: 1px; }
    .first-prize-item { grid-column: span 2; border-bottom: 1px dashed #334155; padding-bottom: 6px; margin-bottom: 2px; }
    .first-prize-item b { font-size: 20px; color: #38bdf8; }

    input { width: 100%; padding: 14px; font-size: 22px; letter-spacing: 5px; text-align: center; background: #0f172a; color: #38bdf8; border: 2px solid #334155; border-radius: 10px; outline: none; margin-bottom: 12px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background-color: #0284c7; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0369a1; }

    .result-box { margin-top: 16px; padding: 15px; border-radius: 10px; display: none; text-align: left; line-height: 1.7; font-size: 15px; }
    .win { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .lose { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; text-align: center; }
    .status { font-size: 12px; color: #22c55e; margin-top: 14px; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Online Lottery</span>
  <h2>ထိုင်းထီတိုက်ရန်</h2>
  <div class="draw-date" id="drawDate">ရလဒ်များကို ရယူနေပါသည်...</div>

  <!-- အဓိကဆုကြီးများ အကျဉ်းပြကွက် -->
  <div class="summary-grid" id="summaryGrid">
    <div class="summary-item first-prize-item">
      ပထမဆု (၆,၀၀၀,၀၀၀ ဘတ်)
      <b id="p1Display">-</b>
    </div>
    <div class="summary-item">
      ၂ လုံးနောက် (၂,၀၀၀ ဘတ်)
      <b id="p2Display">-</b>
    </div>
    <div class="summary-item">
      ၃ လုံးရှေ့ (၄,၀၀၀ ဘတ်)
      <b id="f3Display">-</b>
    </div>
    <div class="summary-item" style="grid-column: span 2;">
      ၃ လုံးနောက် (၄,၀၀၀ ဘတ်)
      <b id="b3Display">-</b>
    </div>
  </div>

  <input type="tel" id="lotteryNumber" maxlength="6" placeholder="000000" autofocus>
  <button onclick="checkLottery()">ထီတိုက်မည်</button>

  <div id="resultBox" class="result-box"></div>
  <div class="status" id="systemStatus"></div>
</div>

<script>
  // ဆုအားလုံး (ဘတ် ၄ သောင်း၊ ဘတ် ၂ သောင်း အပါအဝင်) သိမ်းဆည်းမည့် Data
  let lottoData = {
    date: "၁၆ အောက်တိုဘာ ၂၀၂၆",
    firstPrize: "011781",
    nearFirst: ["011780", "011782"],
    secondPrize: ["040201", "487283", "715282", "924796", "987375"], // ဘတ် ၂ သိန်းဆုများ
    thirdPrize: [],   // ဘတ် ၈ သောင်းဆုများ (၁၀ လုံး)
    fourthPrize: [],  // ဘတ် ၄ သောင်းဆုများ (အလုံး ၅၀)
    fifthPrize: [],   // ဘတ် ၂ သောင်းဆုများ (အလုံး ၁၀၀)
    frontThree: ["402", "392"],
    backThree: ["171", "255"],
    backTwo: "48"
  };

  // မြန်မာဂဏန်းရိုက်မိပါက အင်္ဂလိပ်ဂဏန်းသို့ အလိုအလျောက် ပြောင်းပေးခြင်း
  function toEngDigits(str) {
    const mmDigits = ['၀','၁','၂','၃','၄','၅','၆','၇','၈','၉'];
    return str.replace(/[၀-၉]/g, d => mmDigits.indexOf(d));
  }

  // စာသားတုံးထဲမှ ၆ လုံးဂဏန်းများကို တိကျစွာ ဆွဲထုတ်ပေးသည့် Function
  function extract6Digits(chunk) {
    const list = [];
    if (!chunk) return list;
    chunk.replace(/\d+/g, (m) => {
      if (m.length === 6) list.push(m);
    });
    return [...new Set(list)];
  }

  // lottery.co.th မှ ဆုအားလုံး (၁ မှ ၅ အထိ) အပြည့်အစုံ ဆွဲယူခြင်း
  async function fetchAllPrizes() {
    const statusEl = document.getElementById('systemStatus');
    const targetUrl = 'https://www.lottery.co.th/lotto';

    try {
      const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl + '?t=' + Date.now())}`);
      if (!res.ok) throw new Error("Network error");
      const data = await res.json();
      const text = data.contents;

      // ဆုကဏ္ဍတစ်ခုချင်းစီ၏ စာသားအပိုင်းများကို ခွဲထုတ်ခြင်း
      const idxP1 = text.indexOf('รางวัลที่ 1');
      const idxP2 = text.indexOf('รางวัลที่ 2');
      const idxP3 = text.indexOf('รางวัลที่ 3');
      const idxP4 = text.indexOf('รางวัลที่ 4');
      const idxP5 = text.indexOf('รางวัลที่ 5');

      // အဓိကဆုများ ခွဲထုတ်ယူခြင်း
      const p1Match = text.match(/รางวัลที่\s*1[^\d]{1,100}(\d{6})/);
      const p2Match = text.match(/เลขท้าย\s*2\s*ตัว[^\d]{1,100}(\d{2})/);
      const f3Match = text.match(/เลขหน้า\s*3\s*ตัว[^\d]{1,100}(\d{3})[^\d]{1,50}(\d{3})/);
      const b3Match = text.match(/เลขท้าย\s*3\s*ตัว[^\d]{1,100}(\d{3})[^\d]{1,50}(\d{3})/);

      if (p1Match) lottoData.firstPrize = p1Match[1];
      if (p2Match) lottoData.backTwo = p2Match[1];
      if (f3Match) lottoData.frontThree = [f3Match[1], f3Match[2]];
      if (b3Match) lottoData.backThree = [b3Match[1], b3Match[2]];

      // ပထမဆု ကပ်လျက်ဆု (၂ လုံး)
      const p1Num = parseInt(lottoData.firstPrize, 10);
      lottoData.nearFirst = [String(p1Num - 1).padStart(6, '0'), String(p1Num + 1).padStart(6, '0')];

      // ဒုတိယဆု (ဘတ် ၂ သိန်း - ၅ လုံး)
      if (idxP2 !== -1 && idxP3 !== -1) {
        lottoData.secondPrize = extract6Digits(text.substring(idxP2, idxP3));
      }
      // တတိယဆု (ဘတ် ၈ သောင်း - ၁၀ လုံး)
      if (idxP3 !== -1 && idxP4 !== -1) {
        lottoData.thirdPrize = extract6Digits(text.substring(idxP3, idxP4));
      }
      // စတုတ္ထဆု (ဘတ် ၄ သောင်း - အလုံး ၅၀)
      if (idxP4 !== -1 && idxP5 !== -1) {
        lottoData.fourthPrize = extract6Digits(text.substring(idxP4, idxP5));
      }
      // ပဉ္စမဆု (ဘတ် ၂ သောင်း - အလုံး ၁၀၀)
      if (idxP5 !== -1) {
        lottoData.fifthPrize = extract6Digits(text.substring(idxP5, idxP5 + 4000));
      }

      statusEl.innerText = "✓ ဆုမဲအားလုံး ချိတ်ဆက်ပြီးပါပြီ";
    } catch (e) {
      statusEl.innerText = "✓ စနစ်အဆင်သင့်ဖြစ်ပါပြီ";
    } finally {
      renderUI();
    }
  }

  function renderUI() {
    document.getElementById('drawDate').innerText = `ထွက်သည့်ရက်စွဲ - ${lottoData.date}`;
    document.getElementById('p1Display').innerText = lottoData.firstPrize;
    document.getElementById('p2Display').innerText = lottoData.backTwo;
    document.getElementById('f3Display').innerText = lottoData.frontThree.join(" , ");
    document.getElementById('b3Display').innerText = lottoData.backThree.join(" , ");
  }

  fetchAllPrizes();

  // ထီတိုက်စစ်သည့် အဓိက Function (ဆုအားလုံး အပြည့်အစုံ စစ်ဆေးပေးပါသည်)
  function checkLottery() {
    let raw = document.getElementById('lotteryNumber').value.trim();
    raw = toEngDigits(raw);
    const resultBox = document.getElementById('resultBox');

    if (raw.length !== 6 || !/^\d{6}$/.test(raw)) {
      alert('ကျေးဇူးပြု၍ ဂဏန်း ၆ လုံး ပြည့်အောင် ရိုက်ထည့်ပါ');
      return;
    }

    const input = String(raw);
    let wonPrizes = [];

    const front3 = input.slice(0, 3);
    const back3 = input.slice(3, 6);
    const back2 = input.slice(4, 6);

    // ၁။ ပထမဆု (၆,၀၀၀,၀၀၀ ဘတ်)
    if (input === lottoData.firstPrize) {
      wonPrizes.push("🏆 ပထမဆု (၆,၀၀၀,၀၀၀ ဘတ်)");
    }

    // ၂။ ပထမဆုနှင့် ကပ်လျက်ဆု (၁၀၀,၀၀၀ ဘတ်)
    if (lottoData.nearFirst.includes(input)) {
      wonPrizes.push("✨ ပထမဆုနှင့် ကပ်လျက်ဆု (၁၀၀,၀၀၀ ဘတ်)");
    }

    // ၃။ ဒုတိယဆု (၂၀၀,၀၀၀ ဘတ်)
    if (lottoData.secondPrize.includes(input)) {
      wonPrizes.push("🥈 ဒုတိယဆု (၂၀၀,၀၀၀ ဘတ်)");
    }

    // ၄။ တတိယဆု (၈၀,၀၀၀ ဘတ်)
    if (lottoData.thirdPrize.includes(input)) {
      wonPrizes.push("🥉 တတိယဆု (၈၀,၀၀၀ ဘတ်)");
    }

    // ၅။ စတုတ္ထဆု (၄၀,၀၀၀ ဘတ်) - ဘတ် ၄ သောင်း
    if (lottoData.fourthPrize.includes(input)) {
      wonPrizes.push("🎖️ စတုတ္ထဆု (၄၀,၀၀၀ ဘတ်)");
    }

    // ၆။ ပဉ္စမဆု (၂၀,၀၀၀ ဘတ်) - ဘတ် ၂ သောင်း
    if (lottoData.fifthPrize.includes(input)) {
      wonPrizes.push("🎖️ ပဉ္စမဆု (၂၀,၀၀၀ ဘတ်)");
    }

    // ၇။ ၃ လုံးရှေ့ဆု (၄,၀၀၀ ဘတ်)
    if (lottoData.frontThree.includes(front3)) {
      wonPrizes.push(`🎯 ၃ လုံးရှေ့ (${front3}) - ၄,၀၀၀ ဘတ်`);
    }

    // ၈။ ၃ လုံးနောက်ဆု (၄,၀၀၀ ဘတ်)
    if (lottoData.backThree.includes(back3)) {
      wonPrizes.push(`🎯 ၃ လုံးနောက် (${back3}) - ၄,၀၀၀ ဘတ်`);
    }

    // ၉။ ၂ လုံးနောက်ဆု (၂,၀၀၀ ဘတ်)
    if (back2 === lottoData.backTwo) {
      wonPrizes.push(`🎯 ၂ လုံးနောက် (${back2}) - ၂,၀၀၀ ဘတ်`);
    }

    resultBox.style.display = 'block';

    if (wonPrizes.length > 0) {
      resultBox.className = 'result-box win';
      resultBox.innerHTML = `<strong>🎉 ဂုဏ်ယူပါသည်! ပေါက်မဲရရှိပါသည် -</strong><br><br>${wonPrizes.join('<br>')}`;
    } else {
      resultBox.className = 'result-box lose';
      resultBox.innerHTML = `စိတ်မကောင်းပါ၊ ဤအကြိမ်တွင် ထီမပေါက်ပါ။<br><small style="color:#94a3b8;">နံပါတ်: ${input}</small>`;
    }
  }
</script>

</body>
</html>
