<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ထိုင်းထီ တိုက်စစ်ရန်</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; color: #fff; }
    .card { background: #1e293b; padding: 22px; border-radius: 18px; width: 100%; max-width: 440px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); text-align: center; }
    .badge { background: #0284c7; color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
    h2 { color: #38bdf8; font-size: 22px; margin-bottom: 4px; }
    .draw-date { font-size: 13px; color: #94a3b8; margin-bottom: 16px; min-height: 20px; }

    /* ထီပေါက်စဉ် အကျဉ်းပြကွက် */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 18px; border: 1px solid #334155; text-align: left; }
    .summary-item { font-size: 12px; color: #94a3b8; }
    .summary-item b { display: block; font-size: 15px; color: #f8fafc; margin-top: 2px; letter-spacing: 1px; }
    .first-prize-item { grid-column: span 2; border-bottom: 1px dashed #334155; padding-bottom: 6px; margin-bottom: 2px; }
    .first-prize-item b { font-size: 20px; color: #38bdf8; }

    input { width: 100%; padding: 14px; font-size: 22px; letter-spacing: 5px; text-align: center; background: #0f172a; color: #38bdf8; border: 2px solid #334155; border-radius: 10px; outline: none; margin-bottom: 12px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background-color: #0284c7; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0369a1; }

    .result-box { margin-top: 16px; padding: 15px; border-radius: 10px; display: none; text-align: left; line-height: 1.7; font-size: 15px; }
    .win { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .lose { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; text-align: center; }
    .status { font-size: 12px; color: #22c55e; margin-top: 14px; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Online Lottery</span>
  <h2>ထိုင်းထီတိုက်ရန်</h2>
  <div class="draw-date" id="drawDate">ရလဒ်များကို ချိတ်ဆက်နေပါသည်...</div>

  <!-- အဓိကဆုကြီးများ အကျဉ်းပြကွက် -->
  <div class="summary-grid" id="summaryGrid" style="display: none;">
    <div class="summary-item first-prize-item">
      ပထမဆု (၆,၀၀၀,၀၀၀ ဘတ်)
      <b id="p1Display">-</b>
    </div>
    <div class="summary-item">
      ၂ လုံးနောက် (၂,၀၀၀ ဘတ်)
      <b id="p2Display">-</b>
    </div>
    <div class="summary-item">
      ၃ လုံးရှေ့ (၄,၀၀၀ ဘတ်)
      <b id="f3Display">-</b>
    </div>
    <div class="summary-item" style="grid-column: span 2;">
      ၃ လုံးနောက် (၄,၀၀၀ ဘတ်)
      <b id="b3Display">-</b>
    </div>
  </div>

  <input type="tel" id="lotteryNumber" maxlength="6" placeholder="000000" autofocus>
  <button onclick="checkLottery()">ထီတိုက်မည်</button>

  <div id="resultBox" class="result-box"></div>
  <div class="status" id="systemStatus">ရလဒ်များ စစ်ဆေးနေပါသည်...</div>
</div>

<script>
  let fullLottoData = null;

  // မြန်မာဂဏန်းရိုက်မိပါက အင်္ဂလိပ်ဂဏန်းသို့ အလိုအလျောက် ပြောင်းပေးခြင်း
  function toEngDigits(str) {
    const mmDigits = ['၀','၁','၂','၃','၄','၅','၆','၇','၈','၉'];
    return str.replace(/[၀-၉]/g, d => mmDigits.indexOf(d));
  }

  // ဆု ၁၆၈ ဆုစလုံး အပြည့်အစုံပါဝင်သော Data ကို တိုက်ရိုက်ဆွဲယူခြင်း
  async function loadFullLottoData() {
    const statusEl = document.getElementById('systemStatus');
    const dateEl = document.getElementById('drawDate');

    try {
      // Cache မငြိစေရန် timestamp ထည့်သွင်းထားပါသည်
      const res = await fetch(`https://lotto.api.rayriffy.com/latest?t=${Date.now()}`);
      if (!res.ok) throw new Error("API Error");
      const json = await res.json();

      if (json && json.response) {
        fullLottoData = json.response;
        dateEl.innerText = `ထွက်သည့်ရက်စွဲ - ${fullLottoData.date}`;

        // အဓိကဆုများကို UI တွင် ပြသခြင်း
        const p1 = fullLottoData.prizes.find(p => p.id === 'prizeFirst');
        const b2 = fullLottoData.runningNumbers.find(r => r.id === 'runningNumberBackTwo');
        const f3 = fullLottoData.runningNumbers.find(r => r.id === 'runningNumberFrontThree');
        const b3 = fullLottoData.runningNumbers.find(r => r.id === 'runningNumberBackThree');

        if (p1) document.getElementById('p1Display').innerText = p1.number[0];
        if (b2) document.getElementById('p2Display').innerText = b2.number[0];
        if (f3) document.getElementById('f3Display').innerText = f3.number.join(' , ');
        if (b3) document.getElementById('b3Display').innerText = b3.number.join(' , ');

        document.getElementById('summaryGrid').style.display = 'grid';

        // စုစုပေါင်း ဆုမဲအရေအတွက် တွက်ချက်ပြသခြင်း
        let totalCount = 0;
        fullLottoData.prizes.forEach(p => totalCount += p.number.length);
        statusEl.innerText = `✓ ဆုမဲပေါင်း (${totalCount}) ခုစလုံး အပြည့်အစုံ အဆင်သင့်ရှိပါပြီ`;
      }
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#ef4444;">ချိတ်ဆက်မှု မအောင်မြင်ပါ။ စာမျက်နှာကို Refresh လုပ်ပေးပါ။</span>`;
    }
  }

  loadFullLottoData();

  // ထီတိုက်စစ်သည့် Function
  function checkLottery() {
    let raw = document.getElementById('lotteryNumber').value.trim();
    raw = toEngDigits(raw);
    const resultBox = document.getElementById('resultBox');

    if (!fullLottoData) {
      alert('ထီပေါက်စဉ်များ ချိတ်ဆက်နေဆဲဖြစ်ပါသည်။ ခေတ္တစောင့်ပေးပါ');
      return;
    }

    if (raw.length !== 6 || !/^\d{6}$/.test(raw)) {
      alert('ကျေးဇူးပြု၍ ဂဏန်း ၆ လုံး ပြည့်အောင် ရိုက်ထည့်ပါ');
      return;
    }

    const input = String(raw);
    let wonPrizes = [];

    const front3 = input.slice(0, 3);
    const back3 = input.slice(3, 6);
    const back2 = input.slice(4, 6);

    // ၁။ ၆ လုံးတိုက် ဆုအားလုံး စစ်ဆေးခြင်း (ပထမဆု၊ ကပ်လျက်ဆု၊ ဒုတိယဆု၊ တတိယဆု၊ စတုတ္ထဆု၊ ပဉ္စမဆု)
    if (fullLottoData.prizes) {
      fullLottoData.prizes.forEach(prize => {
        // String အဖြစ် ပြောင်းပြီး ရှေ့သုည "0" မပြုတ်အောင် padStart ဖြင့် စစ်ဆေးခြင်း
        const isWon = prize.number.some(num => String(num).padStart(6, '0') === input);
        if (isWon) {
          let prizeNameMM = prize.name;
          if (prize.id === 'prizeFirst') prizeNameMM = '🏆 ပထမဆု (၆ လုံးတိုက်)';
          else if (prize.id === 'prizeFirstNear') prizeNameMM = '✨ ပထမဆုနှင့် ကပ်လျက်ဆု';
          else if (prize.id === 'prizeSecond') prizeNameMM = '🥈 ဒုတိယဆု (၅ လုံး)';
          else if (prize.id === 'prizeThird') prizeNameMM = '🥉 တတိယဆု (၁၀ လုံး)';
          else if (prize.id === 'prizeForth' || prize.id === 'prizeFourth') prizeNameMM = '🎖️ စတုတ္ထဆု (အလုံး ၅၀)';
          else if (prize.id === 'prizeFifth') prizeNameMM = '🎖️ ပဉ္စမဆု (အလုံး ၁၀၀)';

          wonPrizes.push(`${prizeNameMM} - ဆုကြေး <b>${prize.reward}</b> ဘတ်`);
        }
      });
    }

    // ၂။ ၃ လုံးရှေ့၊ ၃ လုံးနောက်၊ ၂ လုံးနောက် ဆုများ စစ်ဆေးခြင်း
    if (fullLottoData.runningNumbers) {
      fullLottoData.runningNumbers.forEach(item => {
        const checkMatch = (part) => item.number.some(n => String(n) === part);

        if (item.id === "runningNumberFrontThree" && checkMatch(front3)) {
          wonPrizes.push(`🎯 ၃ လုံးရှေ့ (${front3}) - ဆုကြေး <b>${item.reward}</b> ဘတ်`);
        }
        if (item.id === "runningNumberBackThree" && checkMatch(back3)) {
          wonPrizes.push(`🎯 ၃ လုံးနောက် (${back3}) - ဆုကြေး <b>${item.reward}</b> ဘတ်`);
        }
        if (item.id === "runningNumberBackTwo" && checkMatch(back2)) {
          wonPrizes.push(`🎯 ၂ လုံးနောက် (${back2}) - ဆုကြေး <b>${item.reward}</b> ဘတ်`);
        }
      });
    }

    resultBox.style.display = 'block';

    if (wonPrizes.length > 0) {
      resultBox.className = 'result-box win';
      resultBox.innerHTML = `<strong>🎉 ဂုဏ်ယူပါသည်! ပေါက်မဲရရှိပါသည် -</strong><br><br>${wonPrizes.join('<br>')}`;
    } else {
      resultBox.className = 'result-box lose';
      resultBox.innerHTML = `စိတ်မကောင်းပါ၊ ဤအကြိမ်တွင် ထီမပေါက်ပါ။<br><small style="color:#94a3b8;">နံပါတ်: ${input}</small>`;
    }
  }
</script>

</body>
</html>
