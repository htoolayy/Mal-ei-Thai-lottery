<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ထိုင်းထီတိုက်ရန်</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #1e293b; padding: 30px 20px; border-radius: 18px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .header-badge { display: inline-block; background: #0369a1; color: #e0f2fe; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 20px; margin-bottom: 12px; }
    h1 { margin: 0 0 8px 0; font-size: 26px; color: #38bdf8; font-weight: bold; }
    p.date { color: #94a3b8; font-size: 14px; margin: 0 0 25px 0; font-weight: 500; }
    input { width: 100%; padding: 14px; font-size: 24px; text-align: center; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: #38bdf8; letter-spacing: 5px; outline: none; margin-bottom: 15px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; background: #0284c7; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    button:active { background: #0369a1; transform: scale(0.98); }
    #result { margin-top: 20px; font-size: 15px; line-height: 1.6; padding: 14px; border-radius: 10px; display: none; }
    .win { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .lose { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    .loading { color: #64748b; font-size: 12px; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-badge">Online Lottery</div>
  <h1>ထိုင်းထီတိုက်ရန်</h1>
  <p class="date" id="lotteryDate">နောက်ဆုံးထွက် ထီပေါက်စဉ် ရယူနေပါသည်...</p>

  <input type="tel" id="ticketNumber" maxlength="6" placeholder="ဂဏန်း ၆ လုံး">
  <button onclick="checkLottery()">ထီတိုက်မည်</button>

  <div id="result"></div>
  <div id="status" class="loading"></div>
</div>

<script>
  let latestLotto = null;

  async function fetchLatestLottery() {
    const dateEl = document.getElementById("lotteryDate");
    const statusEl = document.getElementById("status");
    try {
      const response = await fetch("https://lotto.api.rayriffy.com/latest");
      const data = await response.json();
      
      if (data && data.status === "success") {
        latestLotto = data.response;
        dateEl.innerText = `ထီထွက်ရက် - ${latestLotto.date}`;
        statusEl.innerText = "✓ နောက်ဆုံးထွက် ပေါက်စဉ် အဆင်သင့်ဖြစ်ပါပြီ";
      } else {
        throw new Error("Data Error");
      }
    } catch (error) {
      dateEl.innerText = "ပေါက်စဉ်ဒေတာ ဆွဲယူနေဆဲဖြစ်သည်";
      statusEl.innerText = "ဆာဗာချိတ်ဆက်ရန် စောင့်ဆိုင်းနေပါသည်...";
    }
  }

  fetchLatestLottery();

  function checkLottery() {
    const num = document.getElementById("ticketNumber").value.trim();
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";

    if (!latestLotto) {
      resultDiv.className = "lose";
      resultDiv.innerText = "ပေါက်စဉ်ဒေတာ ရယူနေဆဲဖြစ်ပါသည်။ ခေတ္တစောင့်ပြီး ပြန်နှိပ်ပေးပါ။";
      return;
    }

    if (num.length !== 6 || isNaN(num)) {
      resultDiv.className = "lose";
      resultDiv.innerText = "ဂဏန်း ၆ လုံး အပြည့် ရိုက်ထည့်ပေးပါ။";
      return;
    }

    const front3 = num.substring(0, 3);
    const back3 = num.substring(3, 6);
    const back2 = num.substring(4, 6);
    let won = [];

    // ပထမဆု
    const firstPrize = latestLotto.prizes.find(p => p.id === "prizeFirst")?.number || [];
    if (firstPrize.includes(num)) won.push("🎉 ပထမဆု (ဘတ် ၆ သန်း)");

    // ပထမဆု ဘေးဆု
    const nearbyPrize = latestLotto.prizes.find(p => p.id === "prizeFirstNearby")?.number || [];
    if (nearbyPrize.includes(num)) won.push("✨ ပထမဆု ဘေးဆု (ဘတ် ၁ သိန်း)");

    // ဒုတိယဆု
    const secondPrize = latestLotto.prizes.find(p => p.id === "prizeSecond")?.number || [];
    if (secondPrize.includes(num)) won.push("✨ ဒုတိယဆု (ဘတ် ၂ သိန်း)");

    // တတိယဆု
    const thirdPrize = latestLotto.prizes.find(p => p.id === "prizeThird")?.number || [];
    if (thirdPrize.includes(num)) won.push("✨ တတိယဆု (ဘတ် ၈ သောင်း)");

    // စတုတ္ထဆု
    const fourthPrize = latestLotto.prizes.find(p => p.id === "prizeForth")?.number || [];
    if (fourthPrize.includes(num)) won.push("✨ စတုတ္ထဆု (ဘတ် ၄ သောင်း)");

    // ပဉ္စမဆု
    const fifthPrize = latestLotto.prizes.find(p => p.id === "prizeFifth")?.number || [];
    if (fifthPrize.includes(num)) won.push("✨ ပဉ္စမဆု (ဘတ် ၂ သောင်း)");

    // ရှေ့ ၃ လုံး
    const frontThree = latestLotto.runningNumbers.find(p => p.id === "runningNumberFrontThree")?.number || [];
    if (frontThree.includes(front3)) won.push("✨ ရှေ့ ၃ လုံးဆု (ဘတ် ၄,၀၀၀)");

    // နောက် ၃ လုံး
    const backThree = latestLotto.runningNumbers.find(p => p.id === "runningNumberBackThree")?.number || [];
    if (backThree.includes(back3)) won.push("✨ နောက် ၃ လုံးဆု (ဘတ် ၄,၀၀၀)");

    // နောက် ၂ လုံး
    const backTwo = latestLotto.runningNumbers.find(p => p.id === "runningNumberBackTwo")?.number || [];
    if (backTwo.includes(back2)) won.push("✨ နောက် ၂ လုံးဆု (ဘတ် ၂,၀၀၀)");

    if (won.length > 0) {
      resultDiv.className = "win";
      resultDiv.innerHTML = `<strong>ဂုဏ်ယူပါတယ်!</strong><br>${won.join("<br>")}`;
    } else {
      resultDiv.className = "lose";
      resultDiv.innerText = "စိတ်မကောင်းပါ၊ ဤအကြိမ်တွင် ထီမပေါက်ပါ။ နောင်အကြိမ် ကံထူးပါစေ။";
    }
  }
</script>
</body>
</html>
