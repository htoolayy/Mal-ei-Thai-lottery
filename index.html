<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ထိုင်းထီ တိုက်စစ်ရန်</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 420px; text-align: center; color: #fff; }
    .badge { background: #0284c7; color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
    h2 { color: #38bdf8; margin: 0 0 8px 0; }
    .draw-date { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
    input { width: 100%; padding: 14px; font-size: 22px; letter-spacing: 5px; text-align: center; background: #0f172a; color: #38bdf8; border: 2px solid #334155; border-radius: 10px; outline: none; margin-bottom: 15px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background-color: #0284c7; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0369a1; }
    .result-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; text-align: left; line-height: 1.6; }
    .win { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .lose { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; text-align: center; }
    .status { font-size: 12px; color: #22c55e; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Online Lottery</span>
  <h2>ထိုင်းထီတိုက်ရန်</h2>
  <div class="draw-date" id="drawDate">ရလဒ်များကို ချိတ်ဆက်နေပါသည်...</div>

  <input type="tel" id="lotteryNumber" maxlength="6" placeholder="000000" autofocus>
  <button onclick="checkLottery()">ထီတိုက်မည်</button>

  <div id="resultBox" class="result-box"></div>
  <div class="status" id="systemStatus"></div>
</div>

<script>
  let lottoData = null;

  // အမြဲ Update ဖြစ်သော Rayriffy API Link ဖြင့် ချိတ်ဆက်ခြင်း
  async function fetchLatestLotto() {
    const statusText = document.getElementById('drawDate');
    try {
      // Cache မကျန်စေရန် timestamp ထည့်၍ ခေါ်ယူခြင်း
      const res = await fetch(`https://lotto.api.rayriffy.com/latest?t=${new Date().getTime()}`);
      const data = await res.json();
      
      if (data && data.response) {
        lottoData = data.response;
        statusText.innerHTML = `လက်ရှိစစ်ဆေးမည့် ထီဖွင့်ရက်စွဲ - <br><b style="color:#f8fafc;">${lottoData.date}</b>`;
        document.getElementById('systemStatus').innerText = '✓ စနစ်အဆင်သင့်ဖြစ်ပါပြီ';
      }
    } catch (error) {
      statusText.innerHTML = `<span style="color:#ef4444;">API ချိတ်ဆက်မှု မအောင်မြင်ပါ။ ပြန်လည် Reload လုပ်ပေးပါ။</span>`;
    }
  }

  fetchLatestLotto();

  function checkLottery() {
    const rawInput = document.getElementById('lotteryNumber').value.trim();
    const resultBox = document.getElementById('resultBox');

    if (!lottoData) {
      alert('ထီပေါက်စဉ်အချက်အလက်များ ဆွဲယူနေဆဲဖြစ်ပါသည်။ ခေတ္တစောင့်ပေးပါ');
      return;
    }

    // ရှေ့သုည "0" မပြုတ်စေရန် String အဖြစ်သာ တိကျစွာ စစ်ဆေးခြင်း
    if (rawInput.length !== 6 || !/^\d{6}$/.test(rawInput)) {
      alert('ကျေးဇူးပြု၍ ဂဏန်း ၆ လုံး ပြည့်အောင် ရိုက်ထည့်ပါ');
      return;
    }

    const input = String(rawInput);
    let wonPrizes = [];

    const front3 = input.slice(0, 3);
    const back3 = input.slice(3, 6);
    const back2 = input.slice(4, 6);

    // ပထမဆုမှ ပဉ္စမဆုအထိ (၆ လုံးတိုက်)
    if (lottoData.prizes) {
      lottoData.prizes.forEach(prize => {
        // String အချင်းချင်းသာ နှိုင်းယှဉ်စေခြင်း
        const match = prize.number.some(num => String(num).padStart(6, '0') === input);
        if (match) {
          wonPrizes.push(`🏆 ${prize.name} (ဆုကြေး: ${prize.reward} ဘတ်)`);
        }
      });
    }

    // ၃ လုံးရှေ့၊ ၃ လုံးနောက်၊ ၂ လုံးနောက် ဆုများ စစ်ဆေးခြင်း
    if (lottoData.runningNumbers) {
      lottoData.runningNumbers.forEach(item => {
        const isMatch = (targetPart) => item.number.some(num => String(num) === targetPart);

        if (item.id === "runningNumberFrontThree" && isMatch(front3)) {
          wonPrizes.push(`🎯 ၃ လုံးရှေ့ (${front3}) - ဆုကြေး ${item.reward} ဘတ်`);
        }
        if (item.id === "runningNumberBackThree" && isMatch(back3)) {
          wonPrizes.push(`🎯 ၃ လုံးနောက် (${back3}) - ဆုကြေး ${item.reward} ဘတ်`);
        }
        if (item.id === "runningNumberBackTwo" && isMatch(back2)) {
          wonPrizes.push(`🎯 ၂ လုံးနောက် (${back2}) - ဆုကြေး ${item.reward} ဘတ်`);
        }
      });
    }

    resultBox.style.display = 'block';

    if (wonPrizes.length > 0) {
      resultBox.className = 'result-box win';
      resultBox.innerHTML = `<strong>🎉 ဂုဏ်ယူပါသည်! ပေါက်မဲရရှိပါသည် -</strong><br><br>${wonPrizes.join('<br>')}`;
    } else {
      resultBox.className = 'result-box lose';
      resultBox.innerHTML = `စိတ်မကောင်းပါ၊ ဤအကြိမ်တွင် ထီမပေါက်ပါ။<br><small style="color:#94a3b8;">နံပါတ်: ${input}</small>`;
    }
  }
</script>

</body>
</html>
