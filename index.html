<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ထိုင်းထီတိုက်ရန်</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #1e293b; padding: 30px 20px; border-radius: 18px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .header-badge { display: inline-block; background: #0369a1; color: #e0f2fe; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 20px; margin-bottom: 12px; }
    h1 { margin: 0 0 8px 0; font-size: 26px; color: #38bdf8; font-weight: bold; }
    p.date { color: #38bdf8; font-size: 13px; margin: 0 0 20px 0; font-weight: bold; }
    input { width: 100%; padding: 14px; font-size: 24px; text-align: center; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: #38bdf8; letter-spacing: 5px; outline: none; margin-bottom: 15px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; background: #0284c7; color: white; border: none; border-radius: 10px; cursor: pointer; }
    button:active { background: #0369a1; }
    #result { margin-top: 20px; font-size: 15px; line-height: 1.6; padding: 14px; border-radius: 10px; display: none; }
    .win { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .lose { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    .loading { color: #94a3b8; font-size: 12px; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-badge">Online Lottery</div>
  <h1>ထိုင်းထီတိုက်ရန်</h1>
  <p class="date" id="lotteryDate">The Thaiger မှ ပေါက်စဉ်ရယူနေပါသည်...</p>

  <input type="tel" id="ticketNumber" maxlength="6" placeholder="ဂဏန်း ၆ လုံး">
  <button onclick="checkLottery()">ထီတိုက်မည်</button>

  <div id="result"></div>
  <div id="status" class="loading">ချိတ်ဆက်နေပါသည်...</div>
</div>

<script>
  let fullHtmlText = "";

  // The Thaiger မှ HTML စာမျက်နှာကို Proxy သုံးပြီး လှမ်းဆွဲခြင်း
  async function fetchFromThaiger() {
    const statusEl = document.getElementById("status");
    const dateEl = document.getElementById("lotteryDate");
    const targetUrl = encodeURIComponent("https://thethaiger.com/thai-lottery");
    const proxyUrl = `https://api.allorigins.win/get?url=${targetUrl}`;

    try {
      const response = await fetch(proxyUrl);
      const data = await response.json();
      
      if (data && data.contents) {
        fullHtmlText = data.contents;
        dateEl.innerText = "✓ နောက်ဆုံးထွက် ပေါက်စဉ်အချက်အလက် ရရှိပါပြီ";
        statusEl.innerText = "The Thaiger နှင့် အောင်မြင်စွာ ချိတ်ဆက်မိပါပြီ";
        statusEl.style.color = "#4ade80";
      } else {
        throw new Error("Proxy error");
      }
    } catch (err) {
      dateEl.innerText = "The Thaiger ဒေတာ ချိတ်ဆက်မရပါ";
      statusEl.innerText = "ဝဘ်ဆိုဒ် လုံခြုံရေးစနစ်ကြောင့် ဆွဲယူရခက်ခဲနေပါသည်";
      statusEl.style.color = "#f87171";
    }
  }

  fetchFromThaiger();

  function checkLottery() {
    const num = document.getElementById("ticketNumber").value.trim();
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";

    if (!fullHtmlText) {
      resultDiv.className = "lose";
      resultDiv.innerText = "ပေါက်စဉ်ဒေတာ ဆွဲယူမရသေးပါ။ ခေတ္တစောင့်ပြီး ပြန်လည်စမ်းသပ်ပါ။";
      return;
    }

    if (num.length !== 6 || isNaN(num)) {
      resultDiv.className = "lose";
      resultDiv.innerText = "ဂဏန်း ၆ လုံး အပြည့် ရိုက်ထည့်ပေးပါ။";
      return;
    }

    // ဆုပေါက်စဉ် စာမျက်နှာထဲတွင် ရိုက်ထည့်သော ဂဏန်း ပါ/မပါ စစ်ဆေးခြင်း
    const front3 = num.substring(0, 3);
    const back3 = num.substring(3, 6);
    const back2 = num.substring(4, 6);

    let isWinner = false;
    let message = [];

    // The Thaiger စာမျက်နှာထဲရှိ ဂဏန်းများကို တိုက်ရိုက် ရှာဖွေခြင်း
    if (fullHtmlText.includes(num)) {
      isWinner = true;
      message.push("🎉 ဆုကြီးတစ်ဆု ပေါက်မဲစာရင်းတွင် တွေ့ရှိပါသည်!");
    }
    if (fullHtmlText.includes(front3)) {
      message.push("✨ ရှေ့ ၃ လုံး ဂဏန်း တိုက်ဆိုင်မှုရှိပါသည်");
    }
    if (fullHtmlText.includes(back3)) {
      message.push("✨ နောက် ၃ လုံး ဂဏန်း တိုက်ဆိုင်မှုရှိပါသည်");
    }
    if (fullHtmlText.includes(back2)) {
      message.push("✨ နောက် ၂ လုံး ဂဏန်း တိုက်ဆိုင်မှုရှိပါသည်");
    }

    if (isWinner || message.length > 0) {
      resultDiv.className = "win";
      resultDiv.innerHTML = `<strong>ဂုဏ်ယူပါတယ်!</strong><br>${message.join("<br>")}`;
    } else {
      resultDiv.className = "lose";
      resultDiv.innerText = "စိတ်မကောင်းပါ၊ ပေါက်မဲစာရင်းတွင် မတွေ့ရှိပါ။ နောင်အကြိမ် ကံထူးပါစေ။";
    }
  }
</script>
</body>
</html>
