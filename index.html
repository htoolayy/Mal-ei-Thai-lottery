<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ထိုင်းထီ တိုက်စစ်ရန်</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; width: 100%; max-width: 460px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
    .badge { background: #0284c7; color: #fff; font-size: 12px; padding: 5px 12px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
    h2 { color: #38bdf8; margin-bottom: 6px; font-size: 22px; }
    p { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
    .widget-container { background: #ffffff; border-radius: 12px; overflow: hidden; }
    iframe { width: 100%; height: 580px; border: none; display: block; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Online Lottery</span>
  <h2>ထိုင်းထီတိုက်ရန်</h2>
  <p>နံပါတ်ရိုက်ထည့်၍ အချိန်နှင့်တပြေးညီ တိုက်စစ်နိုင်ပါသည်</p>

  <div class="widget-container">
    <!-- အမြဲ Update ဖြစ်သော Siam Lottery Real-time Widget -->
    <iframe src="https://www.lottery.co.th/share" loading="lazy"></iframe>
  </div>
</div>

</body>
</html>
